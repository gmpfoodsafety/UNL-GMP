<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>FSMA/GMP Auditor</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; margin: 0; height: 100vh; background: #f0f2f5; }
        #sidebar { width: 320px; background: #1a252f; color: #bfcbd9; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 25px 15px 10px 15px; font-size: 1.6em; font-weight: bold; color: #fff; border-bottom: 1px solid #2c3e50; }
        #menu { flex-grow: 1; overflow-y: auto; padding: 10px; }
        .menu-item { cursor: pointer; padding: 12px 15px; border-bottom: 1px solid #2c3e50; font-size: 0.9em; transition: 0.2s; }
        .menu-item:hover { background: #2c3e50; color: #fff; }
        .menu-item.active { background: #409eff; color: #fff; font-weight: bold; }
        #main { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        .top-nav { background: #fff; padding: 15px 30px; border-bottom: 1px solid #dcdfe6; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        #content { flex-grow: 1; overflow-y: auto; padding: 40px; }
        .question-block { background: #fff; padding: 30px; margin-bottom: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border: 1px solid #ebeef5; }
        .q-title { font-size: 1.5em; font-weight: bold; margin-bottom: 20px; border-bottom: 2px solid #409eff; padding-bottom: 5px; color: #303133; }
        .line { margin: 10px 0; line-height: 1.5; }
        .bold-label { font-weight: bold; color: #606266; }
        .ref-section { margin-top: 20px; padding: 15px; background: #f8f9fa; border-left: 4px solid #409eff; border-radius: 0 4px 4px 0; }
        .hidden { display: none !important; }
        button { padding: 9px 20px; cursor: pointer; border-radius: 4px; border: 1px solid #dcdfe6; background: #fff; font-weight: 600; }
        .save-btn { background: #67c23a; color: white; border: none; }
        .filter-btn { margin: 20px; background: #409eff; color: white; border: none; }
        .notes-area { width: 100%; box-sizing: border-box; margin-top: 10px; padding: 10px; border: 1px solid #dcdfe6; border-radius: 4px; font-family: inherit; resize: vertical; min-height: 80px; }
        input[type="text"] { border: 1px solid #dcdfe6; padding: 8px 12px; border-radius: 4px; outline: none; }
        input[type="text"]:focus { border-color: #409eff; }
    </style>
</head>
<body>
    <div id="sidebar">
        <div class="sidebar-header">GMP Checklist</div>
        <div id="menu"></div>
        <button class="filter-btn" id="filterBtn" onclick="toggleFilter()">Filter Selected</button>
    </div>
    <div id="main">
        <div class="top-nav">
            <div><strong>Company:</strong> <input type="text" id="companyName" placeholder="Enter company name" oninput="globalState.company=this.value"></div>
            <div>
                <button class="save-btn" onclick="saveJSON()">Save Session</button>
                <button onclick="document.getElementById('loadInput').click()">Load Session</button>
                <input type="file" id="loadInput" class="hidden" onchange="loadJSON(event)">
            </div>
        </div>
        <div id="content"></div>
    </div>
    <script>
        const sections = JSON.parse('[{"title": "1. Personnel and Training", "questions": [{"id": "1.1", "title": "1.1. Personnel Cleanliness Requirements", "reqs": {"a": "Personnel must wear clean clothing suitable for the operation and maintain adequate personal cleanliness (\\u00a7 117.10(b)(1)).", "b": "Workers handling food or equipment must wear clean clothes appropriate for their job and keep themselves personally clean at all times.", "c": "Dirty clothing or poor hygiene can transfer bacteria or dirt to food, causing illnesses like food poisoning in consumers.", "d": "Provide clean uniforms daily, enforce daily showers or hand washing routines, and inspect workers before shifts start."}, "refs": [{"text": "Personnel Hygiene", "url": "https://www.youtube.com/watch?v=hCvHklJgyeg&t=230s"}, {"text": "Personnel Hygiene Requirements", "url": "https://www.youtube.com/watch?v=hCvHklJgyeg&t=332s"}, {"text": "Personal Hygiene for Produce Handling", "url": "https://www.youtube.com/watch?v=YrNWkB4Ah5I&list=PL_bTWa1uOqMHgzZY7qGBr8VpCLf-WHCrP&t=7s"}, {"text": "Visitor Management", "url": "https://www.youtube.com/watch?v=jxX38GDqzuw&list=PL_bTWa1uOqMHgzZY7qGBr8VpCLf-WHCrP&t=6s"}]}, {"id": "1.2", "title": "1.2. Hand Cleanliness During Operations", "reqs": {"a": "Personnel must wash hands thoroughly and maintain hand cleanliness to prevent contamination (\\u00a7 117.10(b)(3)).", "b": "Workers must keep hands clean and wash them regularly during food handling to avoid spreading germs.", "c": "Hands are a major source of microbes that can spoil RTE foods and make people sick if not kept clean.", "d": "Set up multiple sinks with soap and post signs reminding workers to wash hands every 30 minutes or after touching non-food items."}, "refs": [{"text": "Handwashing Requirement", "url": "https://www.youtube.com/watch?v=71bKF2lE37E&t=87s"}, {"text": "Handwashing in the Farm", "url": "https://www.youtube.com/watch?v=x85c3gncv3U&list=PL_bTWa1uOqMHgzZY7qGBr8VpCLf-WHCrP&t=7s"}]}, {"id": "1.3", "title": "1.3. Removal of Jewelry and Stones", "reqs": {"a": "Personnel must remove unsecured jewelry and other objects that might fall into food, equipment, or containers (\\u00a7 117.10(b)(4)).", "b": "No loose rings, watches, or bracelets allowed on hands or wrists while working with food.", "c": "Loose items can fall into food, causing choking hazards or physical contamination in RTE products.", "d": "Use a policy requiring all jewelry removal at entry points and provide secure storage lockers near work areas."}, "refs": [{"text": "Employee Jewelry Removal", "url": "https://www.youtube.com/watch?v=hCvHklJgyeg&t=487s"}]}, {"id": "1.4", "title": "1.4. Perspiration Control", "reqs": {"a": "Personnel must take precautions to prevent contamination of food from perspiration (\\u00a7 117.10(b)(1)).", "b": "Wipe sweat from hands and arms promptly to prevent it from dripping into food during hot shifts.", "c": "Sweat can carry skin bacteria into RTE foods, leading to spoilage or infections if consumed.", "d": "Install fans or air conditioning in work areas and supply disposable wipes or towels for quick sweat removal."}, "refs": [{"text": "Air for the Food Industry", "url": "https://www.youtube.com/watch?v=OQX4BORjjbE&t=10s"}]}, {"id": "1.5", "title": "1.5. Hand Washing Before Starting Work", "reqs": {"a": "Personnel must wash hands thoroughly before starting work and after each absence from their workstation (\\u00a7 117.10(b)(3)).", "b": "All workers must wash hands with soap and water right before beginning a shift and after breaks or leaving their station.", "c": "Unwashed hands after breaks can introduce germs from bathrooms or outside, contaminating ready-to-eat items.", "d": "Place handwashing stations at shift start areas and use timers or checklists to ensure compliance every time."}, "refs": [{"text": "Handwashing Requirement", "url": "https://www.youtube.com/watch?v=71bKF2lE37E&t=87s"}]}, {"id": "1.6", "title": "1.6. Hand Washing After Handling Personal Items", "reqs": {"a": "Personnel must wash hands thoroughly after handling personal items that could contaminate food (\\u00a7 117.10(b)(3)).", "b": "Wash hands immediately after using the restroom, touching phones, or handling any personal belongings.", "c": "Personal items often harbor bacteria that can transfer to food, increasing risk of outbreaks in RTE foods.", "d": "Train staff with signs at sinks saying \\"Wash after restroom or phone use\\" and audit logs of handwashing frequency."}, "refs": [{"text": "Handwashing Requirement", "url": "https://www.youtube.com/watch?v=71bKF2lE37E&t=87s"}]}, {"id": "1.7", "title": "1.7. Hand Washing After Touching Unclean Objects", "reqs": {"a": "Personnel must wash hands after contacting unclean surfaces to prevent contamination (\\u00a7 117.10(b)(3)).", "b": "Always wash hands after touching garbage, dirty tools, or any non-food surfaces during work.", "c": "Dirty objects can spread pathogens like E. coli to hands, then directly to RTE products people eat without cooking.", "d": "Designate \\"clean zones\\" and require glove changes or hand washes when crossing from dirty to food areas."}, "refs": [{"text": "Handwashing Requirement", "url": "https://www.youtube.com/watch?v=71bKF2lE37E&t=87s"}]}, {"id": "1.8", "title": "1.8. Disease Reporting and Exclusion", "reqs": {"a": "Personnel with illnesses, open lesions, or infections that could contaminate food must be excluded from operations (\\u00a7 117.10(a)).", "b": "Sick workers with vomiting, diarrhea, or sores must stay home and report illnesses to supervisors.", "c": "Ill workers can shed viruses like norovirus into food, causing widespread sickness in consumers of RTE meals.", "d": "Create a simple illness reporting form and policy sending sick staff home immediately with paid sick leave incentives."}, "refs": [{"text": "Food-borne Illnesses Caused by Sick Employees", "url": "https://www.youtube.com/watch?v=IUldfdqJ9m0&t=4s"}, {"text": "Sick Employee Removal", "url": "https://www.youtube.com/watch?v=71bKF2lE37E&t=343s"}]}, {"id": "1.9", "title": "1.9. Hair Restraint Policies", "reqs": {"a": "Personnel must wear effective hair restraints to prevent contamination (\\u00a7 117.10(b)(6)).", "b": "All staff with exposed hair must cover it completely with nets or hats while in production areas.", "c": "Loose hair can fall into RTE foods, posing choking risks or carrying microbes that sicken eaters.", "d": "Supply disposable hair nets at entry points and train managers to check compliance during daily walkthroughs."}, "refs": [{"text": "Personal Protective Equipment (PPE)", "url": "https://www.youtube.com/watch?v=eHBqfyqIDrg&t=6s"}, {"text": "PPE for Catering", "url": "https://www.youtube.com/watch?v=VW66gmKQGCk"}, {"text": "PPE for Carcass Fabrication", "url": "https://www.youtube.com/watch?v=DegOALvEtPA&t=29s"}]}, {"id": "1.10", "title": "1.10. No Eating or Smoking in Production Areas", "reqs": {"a": "Personnel must not eat, drink, chew gum, or use tobacco in areas where food is exposed (\\u00a7 117.10(b)(8)).", "b": "Ban all food, drinks, gum, or tobacco from food handling zones to avoid spit or crumbs in products.", "c": "Eating in work areas introduces saliva bacteria or particles that can contaminate RTE foods and cause allergies or illness.", "d": "Designate break rooms only for meals and post \\"No Eating Zone\\" signs with spot checks by supervisors."}, "refs": []}, {"id": "1.11", "title": "1.11. Protection from Clothing Contamination", "reqs": {"a": "Personnel must take precautions to protect food and surfaces from contamination by clothing (\\u00a7 117.10(b)(1)).", "b": "Avoid leaning on or touching food with clothes; change aprons if soiled.", "c": "Dirty clothes can transfer chemicals or germs to RTE items, leading to unsafe products reaching customers.", "d": "Use aprons that tie in back for easy removal and train on \\"no touch\\" rules for exposed foods."}, "refs": [{"text": "Employee Dress Code", "url": "https://www.youtube.com/watch?v=UXxsXSTKPFo"}, {"text": "Work Clothing Requirement", "url": "https://www.youtube.com/watch?v=hCvHklJgyeg&t=401s"}, {"text": "Protective Clothing", "url": "https://www.youtube.com/watch?v=mjBaL_uD8O8&t=6s"}]}, {"id": "1.12", "title": "1.12. Training for Qualified Individuals", "reqs": {"a": "Operations must be supervised by qualified individuals with training or experience to ensure safe food production (\\u00a7 117.80(a)(3)).", "b": "Key staff must have documented training to oversee food safety and spot issues.", "c": "Untrained supervisors miss hazards, allowing contaminated RTE foods to be produced and sold.", "d": "Hold annual training sessions with certificates and assign a safety lead for each shift."}, "refs": [{"text": "Qualified Individual Requirement", "url": "https://www.youtube.com/watch?v=Ik-INrYenoI&t=16s"}, {"text": "Definition of Qualified Individual (PCQI)", "url": "https://www.youtube.com/watch?v=y0XKtSpNh8Q&t=827s"}, {"text": "Another Definition of PCQI", "url": "https://www.youtube.com/watch?v=Pc5IG7-VUvw&list=PL_bTWa1uOqMHgzZY7qGBr8VpCLf-WHCrP&t=4s"}, {"text": "Responsibilities of Qualified Individual", "url": "https://safetychain.com/blog/fsma-pcqi-responsibilities"}, {"text": "Employee Food Safety Training", "url": "https://www.youtube.com/watch?v=Zrn10HFswz0&list=PL_bTWa1uOqMHgzZY7qGBr8VpCLf-WHCrP&t=6s"}, {"text": "GMP Best Practices", "url": "https://www.youtube.com/watch?v=XxUr6N2Suig&t=1150s"}, {"text": "GMPs", "url": "https://www.youtube.com/watch?v=gCOtCsew_iA&t=74s"}, {"text": "Microbiology of Food", "url": "https://www.youtube.com/watch?v=nTvZGZV9Pwk"}]}, {"id": "1.13", "title": "1.13. Training to Recognize Issues", "reqs": {"a": "Personnel must be trained to maintain sanitary conditions and prevent contamination (\\u00a7 117.10(b)).", "b": "Train all employees to identify and report dirty equipment or hygiene lapses quickly.", "c": "Spotting problems early prevents big contamination events that could recall products and harm health.", "d": "Use short weekly toolbox talks with examples and quiz workers on recognition."}, "refs": [{"text": "Employee Good Manufacturing Practices", "url": "https://www.youtube.com/watch?v=71bKF2lE37E&t=222s"}]}, {"id": "1.14", "title": "1.14. Designated Sanitation Monitors", "reqs": {"a": "Sanitation procedures must be monitored and documented to ensure compliance (\\u00a7 117.35(a)).", "b": "Assign specific staff to check and record daily cleaning to ensure it\'s done right.", "c": "Without checks, poor cleaning leads to bacteria buildup in RTE facilities, risking consumer illnesses.", "d": "Create a daily log sheet for monitors to sign off on checks and rotate roles to keep it fresh."}, "refs": []}]}, {"title": "2. Plant and Grounds", "questions": [{"id": "2.1", "title": "2.1. Proper Storage of Equipment on Grounds", "reqs": {"a": "Grounds must be maintained to prevent pest attractants, including proper storage of equipment and removal of litter (\\u00a7 117.20(a)(1)).", "b": "Keep tools and waste stored neatly outside and mow grass regularly to deter rodents and insects.", "c": "Clutter attracts pests that carry diseases into the plant, contaminating RTE foods indoors.", "d": "Schedule weekly grounds cleanups and use covered bins for waste to block pest access."}, "refs": [{"text": "Exterior Ground Maintenance", "url": "https://www.youtube.com/watch?v=RuC7Jho-NQY&t=1s"}]}, {"id": "2.2", "title": "2.2. Maintenance of Roads and Parking Lots", "reqs": {"a": "Roads, yards, and parking lots must be maintained to prevent contamination sources (\\u00a7 117.20(a)(2)).", "b": "Keep driveways and lots free of dust, oil, or standing water that could track dirt into the building.", "c": "Muddy or dusty lots allow filth to be carried on shoes into production, dirtying RTE products.", "d": "Pave or gravel lots and sweep daily; provide boot scrapers at entrances."}, "refs": []}, {"id": "2.3", "title": "2.3. Adequate Drainage Around Plant", "reqs": {"a": "Areas around the plant must be adequately drained to prevent contamination by seepage or foot-borne filth (\\u00a7 117.20(a)(3)).", "b": "Ensure rainwater flows away from the building to prevent puddles that breed bacteria or track mud inside.", "c": "Poor drainage creates wet spots where germs grow and spread via feet to food areas.", "d": "Install gutters and gravel trenches; check after rains and fix clogs promptly."}, "refs": []}, {"id": "2.4", "title": "2.4. Waste Treatment Systems", "reqs": {"a": "Waste treatment and disposal systems must be operated to avoid contamination (\\u00a7 117.20(a)(4)).", "b": "Manage trash and sewage systems so they don\'t leak odors or leaks near food zones.", "c": "Leaking waste attracts flies and spreads odors that can taint RTE flavors or cause cross-contamination.", "d": "Contract regular septic pumping and use sealed dumpsters emptied twice weekly."}, "refs": []}, {"id": "2.5", "title": "2.5. Bordering Grounds Control", "reqs": {"a": "Uncontrolled adjacent grounds must be inspected and protected to exclude pests and filth (\\u00a7 117.20(a)(5)).", "b": "Regularly check fences and borders for pests coming from neighboring properties.", "c": "Outside pests can sneak in and infest stored RTE ingredients, leading to recalls.", "d": "Walk borders weekly with pest scouts and seal gaps in fences with mesh."}, "refs": []}, {"id": "2.6", "title": "2.6. Adequate Space for Operations", "reqs": {"a": "The plant must provide sufficient space for equipment and material storage to ensure sanitary operations (\\u00a7 117.20(b)(1)).", "b": "Layout the facility with enough room to move around without bumping into food or tools.", "c": "Crowded spaces cause accidental spills or touches that contaminate RTE batches.", "d": "Map out floor plans annually and rearrange for better flow if needed."}, "refs": [{"text": "Sanitary Facility Design", "url": "https://www.youtube.com/watch?v=71bKF2lE37E&t=425s"}, {"text": "Proper Facility Entrance", "url": "https://www.youtube.com/watch?v=WYMV9WzsyKQ&t=2s"}, {"text": "Walk-In Cooler", "url": "https://www.youtube.com/watch?v=MzP_i1QOPm4&t=2s"}]}, {"id": "2.7", "title": "2.7. Precautions Against Allergen Cross-Contact", "reqs": {"a": "The plant must be designed to reduce the risk of allergen cross-contact through separation or controls (\\u00a7 117.20(b)(2)).", "b": "Separate nut processing from dairy lines with walls or time schedules to avoid mix-ups.", "c": "Allergen traces in RTE foods can cause severe reactions or deaths in sensitive customers.", "d": "Validate separation with air tests and color-code tools for different allergens."}, "refs": [{"text": "Nine Main Food Allegens", "url": "https://www.fda.gov/food/nutrition-food-labeling-and-critical-foods/food-allergies#:~:text=of%20imported%20products.-,Major%20Food%20Allergens,from%20the%20marketplace%20or%20relabeled"}, {"text": "Allergen Basics", "url": "https://www.youtube.com/watch?v=R1IorYhfbiE&t=6s"}, {"text": "Allergen Management", "url": "https://www.youtube.com/watch?v=y2uIyEYemCg&t=3031s"}, {"text": "Cross-Contact vs Cross-Contamination", "url": "https://www.youtube.com/watch?v=2a9i418ULoE"}]}, {"id": "2.8", "title": "2.8. Protection for Outdoor Bulk Vessels", "reqs": {"a": "Outdoor bulk vessels must be protected against contamination (\\u00a7 117.20(b)(3)).", "b": "Cover tanks holding ingredients outside and inspect for bugs weekly.", "c": "Exposed tanks let rain or pests in, spoiling bulk RTE supplies and wasting money.", "d": "Use locked lids and schedule pest sweeps around vessels monthly."}, "refs": []}, {"id": "2.9", "title": "2.9. Cleanable Floors, Walls, and Ceilings", "reqs": {"a": "Floors, walls, and ceilings must be constructed to be cleanable and kept in good repair (\\u00a7 117.20(b)(4)).", "b": "Use smooth, non-porous surfaces on walls and floors that wipe clean easily without cracks.", "c": "Cracked surfaces hide bacteria that later contaminate cleaned RTE equipment.", "d": "Inspect quarterly and repair chips with food-grade sealants."}, "refs": [{"text": "Sanitary Facility Design", "url": "https://www.youtube.com/watch?v=71bKF2lE37E&t=425s"}, {"text": "Receiving Docks", "url": "https://www.youtube.com/watch?v=OREOecASVeY&t=2s"}]}, {"id": "2.10", "title": "2.10. Prevention of Drip Contamination", "reqs": {"a": "Fixtures must be designed to prevent drip or condensate from contaminating food (\\u00a7 117.20(b)(4)).", "b": "Seal pipes and ducts to stop water leaks from overhead onto production lines.", "c": "Dripping water spreads microbes across RTE areas, increasing mold or bacterial growth.", "d": "Install drip pans under condensers and check seals during monthly maintenance."}, "refs": [{"text": "Sanitary Facility Design", "url": "https://www.youtube.com/watch?v=71bKF2lE37E&t=425s"}]}, {"id": "2.11", "title": "2.11. Adequate Aisles and Working Spaces", "reqs": {"a": "Aisles and working spaces must be unobstructed and of adequate width to prevent contamination (\\u00a7 117.20(b)(4)).", "b": "Keep at least 3-foot wide paths between machines for safe movement without touching foods.", "c": "Narrow paths lead to bumps spilling ingredients or transferring dirt to RTE items.", "d": "Mark aisles with tape and train on traffic flow rules."}, "refs": [{"text": "Sanitary Facility Design", "url": "https://www.youtube.com/watch?v=71bKF2lE37E&t=425s"}]}, {"id": "2.12", "title": "2.12. Adequate Lighting in Key Areas", "reqs": {"a": "Adequate lighting must be provided in hand-washing, dressing, toilet, and food handling areas (\\u00a7 117.20(b)(5)).", "b": "Install bright LED lights (at least 50 foot-candles) in production and cleaning spots.", "c": "Dim lights hide dirt or defects in RTE foods, allowing unsafe products out.", "d": "Test light levels with a meter yearly and replace bulbs promptly."}, "refs": [{"text": "Sanitary Facility Design", "url": "https://www.youtube.com/watch?v=71bKF2lE37E&t=425s"}, {"text": "Adequate Illumination", "url": "https://www.youtube.com/watch?v=qVMe0RBLGZQ&t=21s"}]}, {"id": "2.13", "title": "2.13. Shatter-Resistant Lighting", "reqs": {"a": "Lighting must be protected to prevent contamination from breakage (\\u00a7 117.20(b)(5)).", "b": "Coat all overhead lights with plastic guards where food is open below.", "c": "Broken glass in RTE can cause injuries or force full product recalls.", "d": "Retrofit all fixtures with guards and inspect for cracks monthly."}, "refs": [{"text": "Sanitary Facility Design", "url": "https://www.youtube.com/watch?v=71bKF2lE37E&t=425s"}]}, {"id": "2.14", "title": "2.14. Ventilation to Minimize Dust and Odors", "reqs": {"a": "Ventilation systems must minimize dust, odors, and vapors that could contaminate food (\\u00a7 117.20(b)(6)).", "b": "Install exhaust fans to pull out steam and smells from cooking areas.", "c": "Trapped odors or dust settle on RTE surfaces, altering taste or adding allergens.", "d": "Clean vents quarterly and balance air flow to avoid pulling contaminants in."}, "refs": [{"text": "Sanitary Facility Design", "url": "https://www.youtube.com/watch?v=71bKF2lE37E&t=425s"}, {"text": "Air for the Food Industry", "url": "https://www.youtube.com/watch?v=OQX4BORjjbE&t=10s"}]}, {"id": "2.15", "title": "2.15. Air-Blowing Equipment Operation", "reqs": {"a": "Fans must be operated to minimize allergen cross-contact and contamination (\\u00a7 117.20(b)(6)).", "b": "Direct fans away from open food lines to prevent blowing dust toward products.", "c": "Misaimed air spreads particles like allergens across the facility into RTE batches.", "d": "Map fan directions on a diagram and test airflow annually."}, "refs": [{"text": "Air for the Food Industry", "url": "https://www.youtube.com/watch?v=OQX4BORjjbE&t=10s"}, {"text": "Compressed Air", "url": "https://www.youtube.com/watch?v=MLSm-v3x2-I&t=32s"}]}, {"id": "2.16", "title": "2.16. Protection Against Pests", "reqs": {"a": "Effective measures, such as screening, must be used to protect against pests (\\u00a7 117.20(b)(7)).", "b": "Screen all doors and windows to keep flies and rodents out of the building.", "c": "Pests drop feces or hair into RTE foods, spreading diseases like salmonella.", "d": "Install self-closing doors and repair screens immediately if torn."}, "refs": [{"text": "Sanitary Facility Design", "url": "https://www.youtube.com/watch?v=71bKF2lE37E&t=425s"}, {"text": "Whole Foods Rodent Facility Closure", "url": "https://www.youtube.com/watch?v=8rOWdeGelcU&t=6s"}, {"text": "Twelve Tips for Reducing Exterior Pest Attraction", "url": "https://www.qualityassurancemag.com/article/12-practical-tips--for-reducing--exterior-pest-attraction/"}]}, {"id": "2.17", "title": "2.17. Validated Allergen Control Plan", "reqs": {"a": "Measures must be taken to prevent allergen cross-contact, including validated controls (\\u00a7 117.80(a)(4)).", "b": "Document and test methods to keep allergens from mixing in shared spaces.", "c": "Uncontrolled allergens cause life-threatening reactions in RTE consumers.", "d": "Run swab tests quarterly and update plan based on results."}, "refs": [{"text": "Nine Main Food Allergens", "url": "https://www.fda.gov/food/nutrition-food-labeling-and-critical-foods/food-allergies#:~:text=of%20imported%20products.-,Major%20Food%20Allergens,from%20the%20marketplace%20or%20relabeled"}, {"text": "Allergen Residue Testing", "url": "https://www.youtube.com/watch?v=zE5w9DPovms&t=15s"}, {"text": "Allergen Basics", "url": "https://www.youtube.com/watch?v=R1IorYhfbiE&t=6s"}, {"text": "Allergen Regulatory Requirements", "url": "https://www.youtube.com/watch?v=g-tvFNKTDao&t=236s"}, {"text": "Allergen Management", "url": "https://www.youtube.com/watch?v=y2uIyEYemCg&t=3031s"}, {"text": "Allergen Management Control", "url": "https://www.youtube.com/watch?v=7-v5Tth-llE&t=40s"}, {"text": "Practical Allergen Management", "url": "https://www.youtube.com/watch?v=MNi0FNwwY0Y"}, {"text": "Allergen Best Practices", "url": "https://www.crbgroup.com/insights/food-beverage/allergens-food-manufacturing"}]}]}, {"title": "3. Facility Water, Handwashing, and Waste Management", "questions": [{"id": "3.1", "title": "3.1. Potable Water Supply", "reqs": {"a": "Water contacting food or surfaces must be safe and of sanitary quality (\\u00a7 117.37(a)).", "b": "Use only tested city or well water safe for drinking in all food processes.", "c": "Unsafe water introduces pathogens directly into RTE foods, causing outbreaks.", "d": "Test water annually via lab and post results; use filters if needed."}, "refs": [{"text": "Ice Machine Safety", "url": "https://www.youtube.com/watch?v=VPSXZfFvz6M&t=1s"}, {"text": "Ice Machine Safety (bis)", "url": "https://www.youtube.com/watch?v=gc_ph0KsuJQ&t=5s"}, {"text": "Ice is Food", "url": "https://www.youtube.com/watch?v=8HQdEFCYAEk&t=2s"}, {"text": "EcoLab Ice Handler Demo", "url": "https://www.youtube.com/watch?v=Esv2YRT6Lu4"}, {"text": "How an Ice Maker Works", "url": "https://www.youtube.com/shorts/xbH2XH5Pxmo"}]}, {"id": "3.2", "title": "3.2. Adequate Water Quantity and Pressure", "reqs": {"a": "Running water must be provided at suitable temperature and pressure for all required operations (\\u00a7 117.37(a)).", "b": "Ensure hot and cold water flows strongly at sinks for washing and processing.", "c": "Weak water flow leaves residues on equipment, allowing bacteria to grow on RTE lines.", "d": "Check pressure gauges monthly and upgrade pipes if low."}, "refs": []}, {"id": "3.3", "title": "3.3. Backflow Prevention in Water System", "reqs": {"a": "Plumbing must prevent backflow to protect potable water supply (\\u00a7 117.37(b)(1)).", "b": "Fit all hoses and faucets with devices stopping dirty water from flowing back into clean supply.", "c": "Backflow contaminates the whole water system, tainting all RTE production.", "d": "Inspect devices yearly by plumber and label them for easy checks."}, "refs": [{"text": "Drainage and Backflow Prevention", "url": "https://www.youtube.com/watch?v=a1wsse3TIp0&t=2s"}]}, {"id": "3.4", "title": "3.4. Handwashing Stations Availability", "reqs": {"a": "Adequate hand-washing facilities with warm water, soap, and drying devices must be provided (\\u00a7 117.37(e)).", "b": "Place sinks with soap and dryers near every work station for easy access.", "c": "Lack of sinks means unwashed hands touch RTE foods, spreading germs easily.", "d": "Install 1 sink per 10 workers and stock supplies daily."}, "refs": []}, {"id": "3.5", "title": "3.5. Toilet Facilities Accessibility", "reqs": {"a": "Toilet facilities must be adequate, accessible, and maintained (\\u00a7 117.37(c)).", "b": "Have enough clean restrooms close to production without long walks.", "c": "Dirty or far toilets encourage poor hygiene, leading to hand contamination of foods.", "d": "Clean toilets twice daily and add signs directing to nearest ones."}, "refs": []}, {"id": "3.6", "title": "3.6. Toilet Facility Cleanliness", "reqs": {"a": "Toilet facilities must be kept clean and in good repair (\\u00a7 117.37(c)).", "b": "Wipe down toilets and floors regularly to prevent odors or germs building up.", "c": "Filthy restrooms breed bacteria tracked back to RTE areas on shoes or hands.", "d": "Assign a daily cleaner and use checklists for inspections."}, "refs": []}, {"id": "3.7", "title": "3.7. Sewage Disposal Adequacy", "reqs": {"a": "Sewage must be disposed of through an adequate system to prevent contamination (\\u00a7 117.37(d)).", "b": "Connect to city sewer or septic that doesn\'t leak near the plant.", "c": "Sewage leaks spread viruses like hepatitis to ground and into RTE water sources.", "d": "Pump septic yearly and monitor for wet spots around drains."}, "refs": []}, {"id": "3.8", "title": "3.8. Waste Disposal from Plant", "reqs": {"a": "Rubbish must be disposed of to avoid contamination and pest attraction (\\u00a7 117.37(f)).", "b": "Use lidded bins for trash inside and out, away from doors.", "c": "Open trash draws rodents that chew into RTE storage, spreading filth.", "d": "Line bins with bags and schedule pickups to keep them from overflowing."}, "refs": []}]}, {"title": "4. Equipment and Utensils", "questions": [{"id": "4.1", "title": "4.1. Design to Prevent Contamination", "reqs": {"a": "Equipment and utensils must be designed to prevent contamination and be cleanable (\\u00a7 117.40(a)(1)).", "b": "Use smooth, rust-proof materials for all tools touching food.", "c": "Poor design traps food bits where bacteria grow, spoiling RTE batches.", "d": "Audit equipment yearly for cracks and replace non-compliant items."}, "refs": []}, {"id": "4.2", "title": "4.2. Corrosion-Resistant Surfaces", "reqs": {"a": "Food-contact surfaces must be corrosion-resistant and made of non-toxic materials (\\u00a7 117.40(a)(2)).", "b": "Choose stainless steel or plastic parts that don\'t rust or soak up liquids.", "c": "Rusty or absorbent surfaces leach metals or hold moisture for microbial growth in RTE.", "d": "Label approved materials and train buyers on specs."}, "refs": []}, {"id": "4.3", "title": "4.3. Easy Cleaning and Maintenance", "reqs": {"a": "Equipment must be designed and maintained to facilitate cleaning (\\u00a7 117.40(a)(3)).", "b": "Ensure machines have removable parts for thorough washing.", "c": "Hard-to-clean gear harbors biofilms that contaminate every RTE run.", "d": "Create disassembly guides and schedule deep cleans weekly."}, "refs": []}, {"id": "4.4", "title": "4.4. No Lubricants in Food Zones", "reqs": {"a": "Lubricants on food-contact surfaces must be food-grade and safe (\\u00a7 117.40(a)(5)).", "b": "Use food-grade oils only on bearings, never directly on food paths.", "c": "Toxic lubes can drip into RTE, causing chemical poisoning if eaten.", "d": "Store food-grade lubes separately and apply with droppers."}, "refs": []}, {"id": "4.5", "title": "4.5. Temperature Control Equipment Accuracy", "reqs": {"a": "Equipment used for temperature control must be accurate and maintained (\\u00a7 117.40(b)).", "b": "Calibrate fridges and thermometers to exact temps for RTE storage.", "c": "Wrong temps let pathogens multiply in cold RTE salads or meats.", "d": "Calibrate quarterly with certified tools and log results."}, "refs": [{"text": "Thermometer Use", "url": "https://www.youtube.com/watch?v=71bKF2lE37E&t=631s"}, {"text": "Refrigerator Thermometers", "url": "https://www.youtube.com/watch?v=71bKF2lE37E&t=873s"}]}, {"id": "4.6", "title": "4.6. pH and Water Activity Meters", "reqs": {"a": "Instruments for measuring pH or water activity must be accurate and adequate (\\u00a7 117.40(b)).", "b": "Use reliable meters to check acidity or moisture in recipes.", "c": "Inaccurate readings allow unsafe levels where bacteria thrive in RTE sauces.", "d": "Test meters against standards monthly and train one staff per shift."}, "refs": []}, {"id": "4.7", "title": "4.7. Equipment Maintenance Schedule", "reqs": {"a": "Equipment must be maintained in a sanitary condition and repaired as needed (\\u00a7 117.40(c)).", "b": "Inspect and fix broken parts before they affect production.", "c": "Broken equipment leaks contaminants into RTE lines, risking quality loss.", "d": "Use a maintenance calendar app for reminders and parts inventory."}, "refs": []}, {"id": "4.8", "title": "4.8. Frozen Food Handling Equipment", "reqs": {"a": "Frozen foods must be kept frozen and thawed in a manner that prevents adulteration (\\u00a7 117.80(b)(6)).", "b": "Thaw only what you use and discard extras to avoid bacterial risks.", "c": "Refreezing creates ice crystals that harbor germs in RTE frozen meals.", "d": "Portion control thawing in fridge and track usage logs."}, "refs": [{"text": "Proper Thawing of Food", "url": "https://www.youtube.com/watch?v=gTitbP5_FtY&t=371s"}, {"text": "Freezing and Food Safety", "url": "https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/freezing-and-food-safety"}]}]}, {"title": "5. Processes and Controls", "questions": [{"id": "5.1", "title": "5.1. Supervision by Trained Personnel", "reqs": {"a": "Operations must be supervised by competent individuals responsible for sanitation (\\u00a7 117.80(a)(3)).", "b": "Have a trained person overseeing each shift to ensure safe practices.", "c": "Unsupervised steps miss hazards, letting contaminated RTE reach shelves.", "d": "Post shift lead rosters and rotate training to cover all."}, "refs": [{"text": "Blanching in Food Manufacturing", "url": "https://www.youtube.com/watch?v=pdwE1_tL-Zw&t=647s"}, {"text": "Blanching in Thermal Processing", "url": "https://www.youtube.com/watch?v=T_icDygKiAE&t=429s"}, {"text": "LACF and Acidified Foods Regulatory Requirements", "url": "https://www.youtube.com/watch?v=F2rz_2_IEQU"}, {"text": "Challenge Studies for Acidified Foods", "url": "https://www.youtube.com/watch?v=5LtnziEAcsU&t=122s"}]}, {"id": "5.2", "title": "5.2. Raw Material Inspection", "reqs": {"a": "Raw materials must be inspected to ensure they are clean and suitable for processing (\\u00a7 117.80(b)(1)).", "b": "Check incoming ingredients for dirt or damage before accepting.", "c": "Bad raw materials introduce toxins early, spoiling entire RTE batches.", "d": "Train receivers with checklists and reject stamped lots."}, "refs": [{"text": "Ingredient Warehousing", "url": "https://www.youtube.com/watch?v=TWITs02UA_0&t=2s"}]}, {"id": "5.3", "title": "5.3. Raw Material Storage Conditions", "reqs": {"a": "Raw materials must be stored to protect against contamination and deterioration (\\u00a7 117.80(b)(1)).", "b": "Keep dry goods in sealed bins off floors, away from walls.", "c": "Poor storage lets moisture or pests ruin ingredients for RTE mixes.", "d": "Label shelves with dates and rotate stock FIFO."}, "refs": [{"text": "Proper Food Storage", "url": "https://www.youtube.com/watch?v=gTitbP5_FtY&t=291s"}, {"text": "Proper Food Storage (bis)", "url": "https://www.youtube.com/watch?v=HCEDoM-yca8&t=3s"}, {"text": "FIFO Method of Food Storage", "url": "https://www.youtube.com/watch?v=Kl6khNmOHd0&t=8s"}, {"text": "Raw Material Storage and Warehousing", "url": "https://www.youtube.com/watch?v=_osRX0AWLYQ"}]}, {"id": "5.4", "title": "5.4. Supply Chain Ingredient Control", "reqs": {"a": "Raw materials must be handled to ensure they meet safety specifications (\\u00a7 117.80(b)(3)).", "b": "Only buy from vetted vendors who provide purity certificates.", "c": "Unverified supplies can have undeclared allergens or contaminants in RTE.", "d": "Maintain vendor approval list and audit annually."}, "refs": []}, {"id": "5.5", "title": "5.5. Work-in-Progress Handling", "reqs": {"a": "Work-in-process must be handled to protect against contamination (\\u00a7 117.80(c)(5)).", "b": "Cover partial batches and move quickly to next step.", "c": "Exposed WIP picks up airborne dust or allergens, tainting final RTE.", "d": "Use covered carts and time limits for staging."}, "refs": [{"text": "Proper Food Storage", "url": "https://www.youtube.com/watch?v=gTitbP5_FtY&t=291s"}]}, {"id": "5.6", "title": "5.6. Finished Product Protection", "reqs": {"a": "Finished products must be protected from contamination during holding (\\u00a7 117.80(c)(6)).", "b": "Seal packages immediately after filling to block air and bugs.", "c": "Open finished RTE allows recontamination before shipping.", "d": "Inspect seals on line and quarantine if faulty."}, "refs": [{"text": "Protection from Intentional Contamination", "url": "https://www.youtube.com/watch?v=0uAdDmQ99Y4&list=PL_bTWa1uOqMHgzZY7qGBr8VpCLf-WHCrP&t=4s"}, {"text": "Proper Food Storage", "url": "https://www.youtube.com/watch?v=gTitbP5_FtY&t=291s"}]}, {"id": "5.7", "title": "5.7. Temperature Monitoring for Growth Control", "reqs": {"a": "Foods must be held at temperatures that prevent microbial growth (\\u00a7 117.80(c)(3)).", "b": "Log fridge temps every 2 hours for perishable RTE.", "c": "Warm spots let listeria grow in ready-to-eat deli meats and other foods.", "d": "Use digital loggers with alarms and review logs daily."}, "refs": [{"text": "Refrigerator Thermometers", "url": "https://www.youtube.com/watch?v=71bKF2lE37E&t=873s"}, {"text": "Food Transportation", "url": "https://www.youtube.com/watch?v=71bKF2lE37E&t=1812s"}]}, {"id": "5.8", "title": "5.8. pH and Aw Monitoring", "reqs": {"a": "pH and water activity must be controlled to prevent microbial growth (\\u00a7 117.80(c)(15) and \\u00a7 117.80(c)(14)).", "b": "Test each batch for safe acidity or dryness levels.", "c": "Wrong pH allows botulism in low-acid RTE canned goods.", "d": "Standardize recipes and calibrate meters before use."}, "refs": [{"text": "Water Activity in Food Safety", "url": "https://www.youtube.com/watch?v=9gN4z1nMI3I&t=46s"}]}, {"id": "5.9", "title": "5.9. Oxygen Levels for Perishables", "reqs": {"a": "Measures must be taken to control conditions that prevent microbial growth (\\u00a7 117.80(c)(4)).", "b": "Use vacuum packaging for oxygen-sensitive RTE like cheeses.", "c": "Excess oxygen speeds spoilage and mold in packaged RTE.", "d": "Check vacuum seals and store in low-O2 zones."}, "refs": []}, {"id": "5.10", "title": "5.10. Testing for Sanitation Failures", "reqs": {"a": "Testing must be conducted to identify sanitation failures or contamination (\\u00a7 117.80(a)(5)).", "b": "Swab surfaces weekly for bacteria counts.", "c": "Undetected filth leads to chronic contamination in RTE lines.", "d": "Send swabs to local lab and act on high results immediately."}, "refs": []}, {"id": "5.11", "title": "5.11. Environmental Pathogen Monitoring", "reqs": {"a": "Testing must be conducted to identify possible contamination, including environmental pathogens (\\u00a7 117.80(a)(5)).", "b": "Test zones for listeria monthly in wet RTE areas.", "c": "Hidden pathogens in drains cause recalls and illnesses.", "d": "Map high-risk zones and deep clean based on tests."}, "refs": []}, {"id": "5.12", "title": "5.12. Product Testing for Contaminants", "reqs": {"a": "Testing must be conducted to ensure food safety and prevent adulteration (\\u00a7 117.80(a)(5)).", "b": "Sample final RTE for metals or chemicals quarterly.", "c": "Contaminants slip through without tests, harming eaters.", "d": "Partner with affordable testing service and hold stock until cleared."}, "refs": []}, {"id": "5.13", "title": "5.13. Process Adjustments for Deviations", "reqs": {"a": "Corrective actions must be taken when critical limits are not met (\\u00a7 117.80(a)(6)).", "b": "Stop line and rework if temp exceeds safe limit.", "c": "Deviations allow hazards to build, risking RTE safety.", "d": "Write simple SOPs for common fixes and train all staff."}, "refs": [{"text": "Documentation Requirements", "url": "https://www.youtube.com/watch?v=xl07UaO6lgY&t=6s"}]}, {"id": "5.14", "title": "5.14. Labeling to Prevent Cross-Contact", "reqs": {"a": "Food must be handled and labeled to prevent allergen cross-contact (\\u00a7 117.80(b)(8)).", "b": "Tag batches with allergen info during processing.", "c": "Mislabels cause allergic reactions in RTE buyers.", "d": "Use barcode systems for tracking allergens."}, "refs": []}]}, {"title": "6. Sanitation and Pest Control", "questions": [{"id": "6.1", "title": "6.1. General Plant Maintenance", "reqs": {"a": "Buildings and facilities must be maintained in a sanitary condition to prevent adulteration (\\u00a7 117.35(a)).", "b": "Repair leaks and clean floors daily to keep everything spotless.", "c": "Dirty facilities breed germs that jump to RTE during production.", "d": "Daily walkthrough checklists for all areas."}, "refs": []}, {"id": "6.2", "title": "6.2. Cleaning of Utensils and Equipment", "reqs": {"a": "Utensils and equipment must be cleaned and sanitized to prevent contamination (\\u00a7 117.35(a)).", "b": "Wash tools with hot soapy water then sanitizer after each use.", "c": "Residues on tools transfer allergens or bacteria to next RTE batch.", "d": "Set up a 3-sink system and time washes."}, "refs": [{"text": "Three Compartment Sink Process", "url": "https://www.youtube.com/watch?v=VbrDlN-M5zI&t=132s"}, {"text": "Two-Step Cleaning and Sanitizing", "url": "https://www.youtube.com/watch?v=r0sWf0jf6T4&t=3s"}, {"text": "Cleaning and Sanitation of Equipment and Utensils", "url": "https://www.youtube.com/watch?v=ECAN4IbG2jI&t=6s"}, {"text": "Sanitary Zone Concept", "url": "https://www.youtube.com/watch?v=kNwT-5zwtjk&list=PL_bTWa1uOqMHgzZY7qGBr8VpCLf-WHCrP&t=5s"}]}, {"id": "6.3", "title": "6.3. Safe Cleaning Compounds", "reqs": {"a": "Cleaning compounds must be safe and free from undesirable microorganisms (\\u00a7 117.35(b)(1)).", "b": "Buy cleaners with supplier guarantees of purity.", "c": "Contaminated cleaners add germs to surfaces, worsening RTE hygiene.", "d": "Keep spec sheets on file and rotate stock."}, "refs": [{"text": "Food Grade Cleaning Agents", "url": "https://www.youtube.com/watch?v=edBTFMviZYw&t=99s"}]}, {"id": "6.4", "title": "6.4. Storage of Toxic Materials", "reqs": {"a": "Toxic materials must be stored to prevent contamination of food (\\u00a7 117.35(b)(2)).", "b": "Lock chemicals in separate room away from food storage.", "c": "Spilled toxins can poison RTE ingredients or workers.", "d": "Label shelves \\"Chemicals Only\\" and inventory monthly."}, "refs": [{"text": "Storage of Cleaners and Sanitizers", "url": "https://www.youtube.com/watch?v=lcwnKHHUk74&t=42s"}, {"text": "Sanitation Chemicals Storage", "url": "https://www.youtube.com/watch?v=j9WKqE8IouM&t=3s"}, {"text": "Chemical Control", "url": "https://www.youtube.com/watch?v=irqi45r8xEA&t=3s"}, {"text": "Chemical Storage Safety", "url": "https://www.youtube.com/watch?v=4GUSQj-xOBY"}]}, {"id": "6.5", "title": "6.5. Pest Exclusion Measures", "reqs": {"a": "Effective measures must be taken to exclude pests from the facility (\\u00a7 117.35(c)).", "b": "Seal cracks and use door sweeps to block entry points.", "c": "Pests contaminate with droppings, causing salmonella in RTE.", "d": "Monthly pest audits and bait stations outside only."}, "refs": [{"text": "Pest Control", "url": "https://www.youtube.com/watch?v=71bKF2lE37E&t=1638s"}, {"text": "Pest Management", "url": "https://www.youtube.com/watch?v=wnVfiPxEq90&list=PL_bTWa1uOqMHgzZY7qGBr8VpCLf-WHCrP&t=6s"}]}, {"id": "6.6", "title": "6.6. Pesticide Use Restrictions", "reqs": {"a": "Pesticides must be used in a manner that prevents food contamination (\\u00a7 117.35(c)).", "b": "Apply only by licensed pros when plant is empty.", "c": "Pesticide residues on surfaces taint RTE taste and health.", "d": "Document applications and wait 24 hours before reopening."}, "refs": []}, {"id": "6.7", "title": "6.7. Frequency of Food-Contact Cleaning", "reqs": {"a": "Food-contact surfaces must be cleaned as frequently as necessary to prevent contamination (\\u00a7 117.35(d)).", "b": "Scrub lines after every shift or product change.", "c": "Buildup harbors listeria that survives to next RTE run.", "d": "Schedule based on use and verify with ATP swabs."}, "refs": [{"text": "Two-Step Cleaning and Sanitizing", "url": "https://www.youtube.com/watch?v=r0sWf0jf6T4&t=3s"}]}, {"id": "6.8", "title": "6.8. Dry Cleaning for Low-Moisture Foods", "reqs": {"a": "For low-moisture foods, food-contact surfaces must be cleaned and kept dry (\\u00a7 117.35(d)(1)).", "b": "Air dry or towel dry after washing dry food tools.", "c": "Wet spots on dry lines grow mold in powdered RTE mixes.", "d": "Use dedicated dry cloths and fan drying."}, "refs": [{"text": "Allergen Management", "url": "https://www.youtube.com/watch?v=y2uIyEYemCg&t=3031s"}, {"text": "Air for the Food Industry", "url": "https://www.youtube.com/watch?v=OQX4BORjjbE&t=10s"}]}, {"id": "6.9", "title": "6.9. Wet Processing Cleaning", "reqs": {"a": "In wet processing, food-contact surfaces must be cleaned and sanitized before use and after interruptions (\\u00a7 117.35(d)(2)).", "b": "Sanitize soup lines after breaks to kill any settled germs.", "c": "Interruptions let biofilms form, contaminating RTE soups.", "d": "Quick-rinse protocols for short stops."}, "refs": [{"text": "Two-Step Cleaning and Sanitizing", "url": "https://www.youtube.com/watch?v=r0sWf0jf6T4&t=3s"}, {"text": "Cleaning Out of Place (COP)", "url": "https://www.youtube.com/watch?v=vpk5-mUwVcs&t=2s"}, {"text": "Cleaning In Place (CIP) vs COP", "url": "https://www.youtube.com/watch?v=NFkwF6PWNtw&t=6s"}]}, {"id": "6.10", "title": "6.10. Continuous Operation Cleaning", "reqs": {"a": "In continuous operations, food-contact surfaces must be cleaned as necessary during production (\\u00a7 117.35(d)(2)).", "b": "Spot clean moving belts hourly in long runs.", "c": "Uncleaned continuous lines accumulate debris over hours.", "d": "Assign roving cleaners with portable kits."}, "refs": [{"text": "Two-Step Cleaning and Sanitizing", "url": "https://www.youtube.com/watch?v=r0sWf0jf6T4&t=3s"}]}, {"id": "6.11", "title": "6.11. Single-Service Articles Handling", "reqs": {"a": "Single-service articles must be stored and handled to prevent contamination (\\u00a7 117.35(d)(3)).", "b": "Keep paper cups in sealed boxes off floor.", "c": "Dirty disposables add fibers or germs to RTE packaging.", "d": "First-in boxes and discard damaged ones."}, "refs": []}, {"id": "6.12", "title": "6.12. Non-Food-Contact Surface Cleaning", "reqs": {"a": "Non-food-contact surfaces must be cleaned as necessary to protect food (\\u00a7 117.35(e)).", "b": "Wipe machine exteriors weekly to prevent dust transfer.", "c": "Dirty outsides shed particles onto clean insides during RTE.", "d": "Use damp mops and schedule after production."}, "refs": [{"text": "Facility Cleaning", "url": "https://www.youtube.com/watch?v=lcwnKHHUk74&t=6s"}, {"text": "Sanitary Zone Concept", "url": "https://www.youtube.com/watch?v=kNwT-5zwtjk&list=PL_bTWa1uOqMHgzZY7qGBr8VpCLf-WHCrP&t=5s"}, {"text": "Floor Sanitation", "url": "https://www.youtube.com/watch?v=Vf04bjfnKGs&t=2s"}]}, {"id": "6.13", "title": "6.13. Storage of Cleaned Equipment", "reqs": {"a": "Cleaned equipment must be stored to protect food-contact surfaces (\\u00a7 117.35(f)).", "b": "Hang utensils upside down in covered racks.", "c": "Stacked wet tools recontaminate each other for next use.", "d": "Dry racks with drains and cover when not in use."}, "refs": []}, {"id": "6.14", "title": "6.14. Pest Control Program Effectiveness", "reqs": {"a": "An effective pest control program must be maintained to prevent contamination (\\u00a7 117.35(c)).", "b": "Hire pros for quarterly treatments and monitor traps.", "c": "Pests undetected spread throughout, ruining RTE reputation.", "d": "Log trap checks and alert on any signs."}, "refs": []}, {"id": "6.15", "title": "6.15. Cleaning Documentation", "reqs": {"a": "Sanitation monitoring and corrective actions must be documented (\\u00a7 117.35(a)).", "b": "Sign off on each clean with who, when, and method.", "c": "No records mean can\'t prove compliance during audits.", "d": "Simple paper logs or app entries kept 2 years."}, "refs": [{"text": "Documentation Requirements", "url": "https://www.youtube.com/watch?v=xl07UaO6lgY&t=6s"}, {"text": "Two-Step Cleaning and Sanitizing", "url": "https://www.youtube.com/watch?v=r0sWf0jf6T4&t=3s"}]}]}, {"title": "7. Warehousing and Distribution", "questions": [{"id": "7.1", "title": "7.1. Storage Conditions Control", "reqs": {"a": "Food must be held under conditions that prevent contamination and deterioration (\\u00a7 117.93(a)).", "b": "Keep warehouse at 40-70\\u00b0F with low humidity for dry RTE.", "c": "Wrong conditions cause mold or pests in stored RTE packs.", "d": "Install hygrometers and alarm if out of range."}, "refs": [{"text": "Proper Food Storage", "url": "https://www.youtube.com/watch?v=gTitbP5_FtY&t=291s"}, {"text": "Humidity Control", "url": "https://www.youtube.com/watch?v=_KdHyawKdUQ&t=33s"}]}, {"id": "7.2", "title": "7.2. Transportation Protection", "reqs": {"a": "Food must be transported under conditions that prevent contamination (\\u00a7 117.93(b)).", "b": "Use clean, covered trucks dedicated to food.", "c": "Dirty trucks transfer chemicals or allergens to RTE shipments.", "d": "Inspect vehicles pre-load and clean after each trip."}, "refs": [{"text": "Sanitary Transportation of Food", "url": "https://www.youtube.com/watch?v=keV6dtwy30U&list=PL_bTWa1uOqMHgzZY7qGBr8VpCLf-WHCrP&t=4s"}, {"text": "Proper Food Storage", "url": "https://www.youtube.com/watch?v=gTitbP5_FtY&t=291s"}]}, {"id": "7.3", "title": "7.3. Allergen Cross-Contact in Holding", "reqs": {"a": "Food must be held to prevent allergen cross-contact (\\u00a7 117.80(c)(6)).", "b": "Segregate allergen packs in warehouse by type.", "c": "Mixed storage leads to label errors and reactions.", "d": "Color-coded shelves and double-check loads."}, "refs": [{"text": "Proper Food Storage", "url": "https://www.youtube.com/watch?v=gTitbP5_FtY&t=291s"}, {"text": "Nine Main Food Allegens", "url": "https://www.fda.gov/food/nutrition-food-labeling-and-critical-foods/food-allergies#:~:text=of%20imported%20products.-,Major%20Food%20Allergens,from%20the%20marketplace%20or%20relabeled"}, {"text": "Allergen Basics", "url": "https://www.youtube.com/watch?v=R1IorYhfbiE&t=6s"}, {"text": "Allergen Management", "url": "https://www.youtube.com/watch?v=y2uIyEYemCg&t=3031s"}]}, {"id": "7.4", "title": "7.4. Stock Rotation Documentation", "reqs": {"a": "Food must be held to prevent deterioration, implying FIFO rotation (\\u00a7 117.93(a)).", "b": "Date all incoming and pull oldest for shipping.", "c": "Old stock spoils, wasting money and risking bad RTE sales.", "d": "Label with dates and train pickers on FIFO."}, "refs": [{"text": "FIFO Method of Food Storage", "url": "https://www.youtube.com/watch?v=Kl6khNmOHd0&t=8s"}]}, {"id": "7.5", "title": "7.5. Finished Product Labeling for Allergens", "reqs": {"a": "Food must be labeled to prevent allergen cross-contact (\\u00a7 117.80(b)(8)).", "b": "Print bold allergen warnings on every RTE package.", "c": "Poor labels cause accidental exposure in consumers.", "d": "Review labels quarterly and use software for updates."}, "refs": [{"text": "Nine Main Food Allegens", "url": "https://www.fda.gov/food/nutrition-food-labeling-and-critical-foods/food-allergies#:~:text=of%20imported%20products.-,Major%20Food%20Allergens,from%20the%20marketplace%20or%20relabeled"}, {"text": "Allergen Labeling", "url": "https://www.youtube.com/watch?v=P73r-QMMtdY&t=80s"}, {"text": "Allergen Labeling Causing Recalls", "url": "https://www.youtube.com/watch?v=eLNpX7ASQGU&t=73s"}]}, {"id": "7.6", "title": "7.6. Temperature Abuse Checks on Receipt", "reqs": {"a": "Raw materials must be inspected to ensure they are suitable for processing (\\u00a7 117.80(b)(1)).", "b": "Probe chilled deliveries and reject if over 41\\u00b0F.", "c": "Warm receipts start bacterial growth before RTE processing.", "d": "Handheld thermometers at dock and log rejections."}, "refs": [{"text": "Thermometer Use", "url": "https://www.youtube.com/watch?v=71bKF2lE37E&t=631s"}]}, {"id": "7.7", "title": "7.7. Distribution Temperature Monitoring", "reqs": {"a": "Food must be transported under conditions that prevent microbial growth (\\u00a7 117.93(b)).", "b": "Use reefers set to 35\\u00b0F for cold RTE transport.", "c": "Heat spikes in transit spoil RTE before delivery.", "d": "Data loggers in trucks with post-trip reviews."}, "refs": []}]}, {"title": "8. By-Products for Animal Food", "questions": [{"id": "8.1", "title": "8.1. By-Product Storage to Prevent Contamination", "reqs": {"a": "By-products for animal food must be stored to prevent contamination of human food (\\u00a7 117.95(a)).", "b": "Keep scraps in separate, sealed area away from human RTE.", "c": "Mixed storage contaminates edible human by-products.", "d": "Dedicated bins labeled \\"Animal Only\\" in isolated room."}, "refs": [{"text": "Holding and Distribution of By-Products (21CFR507.28)", "url": "https://www.ecfr.gov/current/title-21/chapter-I/subchapter-E/part-507/subpart-B/section-507.28"}, {"text": "Holding and Distribution of By-Products (21CFR117.95)", "url": "https://www.ecfr.gov/current/title-21/chapter-I/subchapter-B/part-117/subpart-B/section-117.95"}]}, {"id": "8.2", "title": "8.2. Handling of By-Products", "reqs": {"a": "By-products must be handled to prevent contamination of human food (\\u00a7 117.95(b)).", "b": "Use dedicated tools for moving scraps to avoid cross-touch.", "c": "Shared tools transfer human food germs to animal feed lines.", "d": "Color-code scoops and clean separately."}, "refs": []}, {"id": "8.3", "title": "8.3. Transportation of By-Products", "reqs": {"a": "By-products must be transported to prevent contamination of human food (\\u00a7 117.95(c)).", "b": "Use covered trailers only for animal feed scraps.", "c": "Open transport spills attract pests near plant.", "d": "Schedule off-hour pickups and inspect vehicles."}, "refs": [{"text": "Holding and Distribution of By-Products (21CFR507.28)", "url": "https://www.ecfr.gov/current/title-21/chapter-I/subchapter-E/part-507/subpart-B/section-507.28"}, {"text": "Holding and Distribution of By-Products (21CFR117.95)", "url": "https://www.ecfr.gov/current/title-21/chapter-I/subchapter-B/part-117/subpart-B/section-117.95"}]}, {"id": "8.4", "title": "8.4. Container Inspection for By-Products", "reqs": {"a": "Containers for by-products must be inspected to ensure suitability (\\u00a7 117.95(d)).", "b": "Check bins for cleanliness before filling with scraps.", "c": "Dirty containers add contaminants to feed, indirectly affecting plant.", "d": "Pre-use wash and log inspections."}, "refs": []}, {"id": "8.5", "title": "8.5. Accurate Labeling of By-Products", "reqs": {"a": "By-products must be accurately labeled to prevent misuse (\\u00a7 117.95(e)).", "b": "Tag all with \\"Not for Human Food - Animal Use Only\\".", "c": "Mislabels risk accidental human use of unfit scraps.", "d": "Use tamper-proof tags and train fillers."}, "refs": []}]}, {"title": "9. Defect Action Levels", "questions": [{"id": "9.1", "title": "9.1. Minimizing Natural Defects", "reqs": {"a": "Quality control operations must minimize natural or unavoidable defects to acceptable levels (\\u00a7 117.110(a)).", "b": "Set limits for things like insect parts in grains and test regularly.", "c": "High defects make RTE unappetizing or unsafe if over limits.", "d": "Buy from low-defect suppliers and screen incoming."}, "refs": [{"text": "Defect Action Levels (21CFR117.110)", "url": "https://www.ecfr.gov/current/title-21/chapter-I/subchapter-B/part-117/subpart-B/section-117.110"}]}, {"id": "9.2", "title": "9.2. Procedures for Defective Foods", "reqs": {"a": "Defective foods must be handled to prevent mixing with safe food (\\u00a7 117.110(b)).", "b": "Quarantine bad batches separately and dispose properly.", "c": "Mixed defects lower overall RTE quality and trigger recalls.", "d": "Clear SOP with flowcharts and train on segregation."}, "refs": [{"text": "Defect Action Levels (21CFR117.110)", "url": "https://www.ecfr.gov/current/title-21/chapter-I/subchapter-B/part-117/subpart-B/section-117.110"}, {"text": "--", "url": null}]}]}]');
        let globalState = { company: "", results: {}, isFiltered: false, currentSectionIdx: 0 };

        function init() {
            if (!sections.length) return;
            renderMenu(); renderSection();
        }

        function renderMenu() {
            const menu = document.getElementById('menu');
            menu.innerHTML = "";
            sections.forEach((sec, idx) => {
                const hasSel = sec.questions.some(q => globalState.results[q.id]?.selected);
                if (globalState.isFiltered && !hasSel) return;
                const item = document.createElement('div');
                item.className = 'menu-item' + (globalState.currentSectionIdx === idx ? ' active' : '');
                item.innerText = sec.title;
                item.onclick = () => { globalState.currentSectionIdx = idx; renderMenu(); renderSection(); };
                menu.appendChild(item);
            });
        }

        function renderSection() {
            const container = document.getElementById('content');
            const sec = sections[globalState.currentSectionIdx];
            if (!sec) return;
            container.innerHTML = `<h1 style="margin-top:0; color:#303133;">${sec.title}</h1>`;
            sec.questions.forEach(q => {
                const res = globalState.results[q.id] || { selected: false, corrected: false, notes: "" };
                if (globalState.isFiltered && !res.selected) return;
                const div = document.createElement('div');
                div.className = 'question-block';
                const refs = q.refs.map(r => r.url ? `<li><a href="${r.url}" target="_blank">${r.text}</a></li>` : `<li>${r.text}</li>`).join('');
                div.innerHTML = `
                    <div class="q-title">${q.title}</div>
                    <div class="line"><span class="bold-label">a. CFR:</span> ${q.reqs.a}</div>
                    <div class="line"><span class="bold-label">b. Requirement:</span> ${q.reqs.b}</div>
                    <div class="line"><span class="bold-label">c. Significance:</span> ${q.reqs.c}</div>
                    <div class="line"><span class="bold-label">d. Fix:</span> ${q.reqs.d}</div>
                    <div class="ref-section"><span class="bold-label">e. REFERENCES:</span><ul>${refs || 'None'}</ul></div>
                    <div style="margin-top:20px; border-top:1px solid #eee; padding-top:15px;">
                        <label style="cursor:pointer; display:flex; align-items:center;">
                            <input type="checkbox" onchange="upd('${q.id}', 'selected', this.checked)" ${res.selected ? 'checked' : ''} style="margin-right:10px; transform:scale(1.2);"> 
                            <strong>Select Question</strong>
                        </label>
                        <div id="carea-${q.id}" class="${res.selected ? '' : 'hidden'}" style="margin-top:15px;">
                            <div style="margin-bottom:12px; padding-left:25px;">
                                <label style="cursor:pointer; display:flex; align-items:center; color:#e6a23c;">
                                    <input type="checkbox" onchange="upd('${q.id}', 'corrected', this.checked)" ${res.corrected ? 'checked' : ''} style="margin-right:10px; transform:scale(1.2);"> 
                                    <strong>Corrected</strong>
                                </label>
                            </div>
                            <div class="bold-label" style="padding-left:2px;">Notes:</div>
                            <textarea class="notes-area" placeholder="Enter observations or corrective actions taken..." oninput="upd('${q.id}', 'notes', this.value)">${res.notes || ""}</textarea>
                        </div>
                    </div>`;
                container.appendChild(div);
            });
            container.scrollTop = 0;
        }

        function upd(id, key, val) {
            if (!globalState.results[id]) globalState.results[id] = {selected:false, corrected:false, notes:""};
            globalState.results[id][key] = val;
            if (key === 'selected') {
                const area = document.getElementById(`carea-${id}`);
                if (area) area.classList.toggle('hidden', !val);
                if (globalState.isFiltered) { renderMenu(); renderSection(); }
            }
        }

        function toggleFilter() {
            globalState.isFiltered = !globalState.isFiltered;
            document.getElementById('filterBtn').innerText = globalState.isFiltered ? "Unfilter" : "Filter Selected";
            renderMenu(); renderSection();
        }

        function saveJSON() {
            const blob = new Blob([JSON.stringify(globalState, null, 2)], {type:'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = (globalState.company || "audit") + ".json";
            a.click();
        }

        function loadJSON(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const loaded = JSON.parse(event.target.result);
                globalState.company = loaded.company || "";
                globalState.results = loaded.results || {};
                globalState.isFiltered = loaded.isFiltered || false;
                globalState.currentSectionIdx = loaded.currentSectionIdx || 0;
                document.getElementById('companyName').value = globalState.company;
                document.getElementById('filterBtn').innerText = globalState.isFiltered ? "Unfilter" : "Filter Selected";
                renderMenu(); renderSection();
            };
            reader.readAsText(file);
            e.target.value = ""; 
        }
        window.onload = init;
    </script>
</body>
